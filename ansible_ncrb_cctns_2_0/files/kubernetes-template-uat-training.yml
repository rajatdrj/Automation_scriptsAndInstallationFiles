apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "training-cctns-uat-role"
        vault.hashicorp.com/agent-inject-secret-application-properties: "${VAULT_SECRETS_TRAINING}"
        vault.hashicorp.com/agent-inject-template-application-properties: |
          ${VAULT_TEMPLATE_TRAINING}
        vault.hashicorp.com/agent-inject-file-application-properties: "application.properties"
    spec:
      serviceAccountName: training-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: environment
                operator: In
                values:
                  - training
      containers:
        - name: ${SERVICE_NAME}
          image: cctns.registry.uat.gov.in:5043/${SERVICE_NAME}:1.0.23
          ports:
            - containerPort: ${APP_PORT}
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-uat-training


---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
spec:
  selector:
    app: ${SERVICE_NAME}
  ports:
    - protocol: TCP
      port: ${APP_PORT}
      targetPort: ${APP_PORT}
  type: ClusterIP
