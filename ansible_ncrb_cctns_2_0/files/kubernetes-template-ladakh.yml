apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "la-cctns-uat-role"
        vault.hashicorp.com/agent-limits-cpu: ""
        vault.hashicorp.com/agent-requests-cpu: ""
        vault.hashicorp.com/agent-limits-mem: ""
        vault.hashicorp.com/agent-requests-mem: ""
        vault.hashicorp.com/agent-inject-secret-application-properties: "${VAULT_SECRETS_LADAKH}"
        vault.hashicorp.com/agent-inject-template-application-properties: |
          ${VAULT_TEMPLATE_LADAKH}
        vault.hashicorp.com/agent-inject-file-application-properties: "application.properties"
    spec:
      serviceAccountName: uat-ladakh-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: state
                operator: In
                values:
                  - ladakh
              - key: tier
                operator: In
                values:
                  - backend
      containers:
        - name: ${SERVICE_NAME}
          image: cctns.registry.uat.gov.in:5043/${SERVICE_NAME}:1.0.23
          ports:
            - containerPort: ${APP_PORT}
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-uat-ladakh
            - configMapRef:
                name: common-config-uat-ladakh
          volumeMounts:
            - name: kafka-certs-vol
              mountPath: /app/kafka-certs
              readOnly: true
            - name: kafka-dev-certs-vol
              mountPath: /app/kafka-certs-dev
              readOnly: true


      volumes:
        - name: kafka-certs-vol
          secret:
            secretName: kafka-ladakh-certs
        - name: kafka-dev-certs-vol
          secret:
            secretName: kafka-dev-certs



---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
spec:
  selector:
    app: ${SERVICE_NAME}
  ports:
    - protocol: TCP
      port: ${APP_PORT}
      targetPort: ${APP_PORT}
  type: ClusterIP
