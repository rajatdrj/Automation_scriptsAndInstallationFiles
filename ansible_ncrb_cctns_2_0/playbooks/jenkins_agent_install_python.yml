---
- name: Install Python packages on RHEL 9
  hosts: all
  become: yes
  
  tasks:
    - name: Install python3-pip
      dnf:
        name: python3-pip
        state: present
        
    - name: Install pandas and openpyxl
      pip:
        name:
          - pandas
          - openpyxl
        executable: pip3
        state: present
